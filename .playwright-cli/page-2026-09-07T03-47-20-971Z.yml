      - generic [ref=f3e28]:
        - paragraph [ref=f3e29]: MeteoAuMaroc
        - heading "Politique éditoriale et méthodologie" [level=1] [ref=f3e30]
        - paragraph [ref=f3e31]: Cette page explique qui publie MeteoAuMaroc, d'où viennent les données, comment nos pages sont préparées et comment demander une correction.
        - paragraph [ref=f3e32]: 7 September 2026
      - generic [ref=f3e33]:
        - generic [ref=f3e34]:
          - heading "Qui publie ce site ?" [level=2] [ref=f3e35]
          - paragraph [ref=f3e36]: MeteoAuMaroc est un service météorologique numérique indépendant consacré aux villes et régions du Maroc. Le site est maintenu par l'équipe MeteoAuMaroc depuis Casablanca. Notre objectif est de rendre des données techniques faciles à comprendre en français, arabe et anglais.
          - paragraph [ref=f3e37]: Les contenus éditoriaux sont publiés sous la responsabilité de l'équipe MeteoAuMaroc. Nous n'affirmons aucune affiliation avec la Direction générale de la météorologie marocaine.
        - generic [ref=f3e38]:
          - heading "Sources des données" [level=2] [ref=f3e39]
          - paragraph [ref=f3e40]: "Les observations actuelles, prévisions et données de qualité de l'air proviennent de l'API OpenWeather. Les horaires de prière proviennent de l'API Aladhan. Les tableaux climatiques mensuels sont des repères historiques généraux : ils ne remplacent pas une prévision datée."
          - paragraph [ref=f3e41]: Nous identifions la source près des modules concernés. Les données de tiers peuvent être retardées, révisées ou temporairement indisponibles.
        - generic [ref=f3e42]:
          - heading "Comment les pages sont préparées" [level=2] [ref=f3e43]
          - paragraph [ref=f3e44]: Nos pages combinent les réponses des fournisseurs avec une présentation, des comparaisons saisonnières et des explications rédigées pour le contexte marocain. Les valeurs en temps réel sont mises en cache afin de limiter les appels inutiles, puis rafraîchies selon le type de donnée.
          - paragraph [ref=f3e45]: Avant publication, nous vérifions la cohérence des unités, des noms de villes, des liens, de la période de prévision et des avertissements de sécurité. Nous indiquons une date de mise à jour lorsque le contenu éditorial change réellement.
        - generic [ref=f3e46]:
          - heading "Limites et sécurité" [level=2] [ref=f3e47]
          - paragraph [ref=f3e48]: Une prévision reste probabiliste et peut changer rapidement, surtout en montagne, sur le littoral et lors d'épisodes extrêmes. MeteoAuMaroc ne doit pas être la seule source utilisée pour une décision de sécurité, maritime, aérienne, agricole ou professionnelle.
          - paragraph [ref=f3e49]: Pour les alertes officielles et les consignes d'urgence, consultez Maroc Météo et les autorités locales. En cas de danger immédiat, suivez les instructions des services publics.
        - generic [ref=f3e50]:
          - heading "Corrections" [level=2] [ref=f3e51]
          - paragraph [ref=f3e52]: Si vous repérez une erreur factuelle, une ville mal localisée, une traduction incorrecte ou un lien cassé, envoyez l'URL et une description précise via notre page Contact. Nous vérifions les signalements et corrigeons les erreurs confirmées dès que possible.
        - generic [ref=f3e53]:
          - heading "Publicité et indépendance" [level=2] [ref=f3e54]
          - paragraph [ref=f3e55]: La publicité aide à financer l'hébergement et la maintenance. Elle ne détermine pas nos descriptions météo ni nos conseils. Les annonces, lorsqu'elles sont activées, sont séparées du contenu et ne sont jamais présentées comme des boutons de navigation ou des alertes.
        - link "Signaler une correction" [ref=f3e57] [cursor=pointer]:
          - /url: /fr/pages/contact
